[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pfn-supervision-research"
version = "0.1.0"
description = "Finite-prior PFN supervision experiments and scientific checks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "torch==2.9.1"]

[tool.setuptools.packages.find]
where = ["src"]
