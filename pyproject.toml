[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pfn-supervision-research"
version = "0.1.0"
description = "Code companion for Separating Supervision Randomness in Prior-Data Fitted Networks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "torch==2.9.1"]

[project.urls]
Repository = "https://github.com/bowenzhaosh/pfn-supervision-public"
Issues = "https://github.com/bowenzhaosh/pfn-supervision-public/issues"

[tool.setuptools.packages.find]
where = ["src"]
