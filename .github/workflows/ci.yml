name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            locks/reviewer-requirements.txt
      - name: Install CPU environment and package
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
          python -m pip check
      - name: Verify public and scientific provenance
        run: python scripts/verify_provenance.py
      - name: Check scientific identities and saved contrasts
        run: |
          python -m unittest discover -s tests -v
          python scripts/reproduce_contrast.py
          python scripts/compare_checkpoints.py --self-test
      - name: Run bounded CPU example
        run: python scripts/train.py --config configs/reviewer/tiny.json --out outputs/tiny.json
